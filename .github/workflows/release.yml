name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tools
        run: python -m pip install --upgrade pip && python -m pip install -e . build
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify tag and package version
        run: test "v$(python -c 'import vgtree; print(vgtree.__version__)')" = "$GITHUB_REF_NAME"
      - name: Build artifacts
        run: python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "VGTREE $GITHUB_REF_NAME"
