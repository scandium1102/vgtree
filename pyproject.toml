[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vgtree"
version = "1.1.0"
description = "Verifiable tree workflows for AI agents and Obsidian."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "VGTREE Contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.scripts]
vgtree = "vgtree.cli:main"

[project.urls]
Homepage = "https://github.com/scandium1102/vgtree"
Repository = "https://github.com/scandium1102/vgtree"
Issues = "https://github.com/scandium1102/vgtree/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vgtree = ["schemas/*.json", "templates/obsidian/*", "templates/obsidian/**/*"]
